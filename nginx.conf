server {
    listen 80;
    server_name localhost;

    # 1. Раздача статики (ваш фронтенд)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }

    # 2. Проксирование запросов к API на сервер Node.js
    location /api/ {
        # api — это имя сервиса из docker-compose.yml, 8080 — порт сервера
        proxy_pass http://api:8080; 
        
        # Передача заголовков (чтобы сервер понимал, откуда пришел запрос)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
