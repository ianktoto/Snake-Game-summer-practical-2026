services:
  db:
    image: postgres:15-alpine
    container_name: snake_db
    environment:
      POSTGRES_USER: snake
      POSTGRES_PASSWORD: snake
      POSTGRES_DB: snake
    volumes:
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    ports:
      - "5432:5432"

  api:
    build: ./server
    container_name: snake_game-api-1
    env_file:
      - ./server/.env
    depends_on:
      - db
    ports:
      - "8080:8080"

  nginx:
    image: nginx:alpine
    container_name: snake_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client:/usr/share/nginx/html:ro
    depends_on:
      - api
